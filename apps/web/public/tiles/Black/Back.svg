<svg width="120" height="160" viewBox="0 0 120 160"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- 竹纹 pattern -->
    <pattern id="bamboo" width="27" height="27" patternUnits="userSpaceOnUse">
      <!-- 横向竹条 -->
      <path d="M0 6.75 H27 M0 20.25 H27"
            stroke="#8fbf86"
            stroke-width="2.25"
            />

      <!-- 纵向竹条 -->
      <path d="M6.75 0 V27 M20.25 0 V27"
            stroke="#6fa66d"
            stroke-width="2.25"
            />

      <!-- 竹节 -->
      <circle cx="6.75" cy="6.75" r="1.8" fill="#5c8c59"/>
      <circle cx="20.25" cy="20.25" r="1.8" fill="#5c8c59"/>
    </pattern>

    <filter id="shadow">
      <feDropShadow dx="2" dy="3"
                    stdDeviation="2"
                    flood-opacity="0.35"/>
    </filter>
  </defs>


  <!-- 麻将牌 -->
  <rect x="5" y="5"
        width="110"
        height="150"
        rx="12"
        fill="#5c3a1e"
        stroke="#4d7b45"
        stroke-width="4"
        filter="url(#shadow)"/>


  <!-- 竹纹区域 -->
  <rect x="12" y="12"
        width="96"
        height="136"
        rx="8"
        fill="url(#bamboo)"/>


  <!-- 中间装饰 -->
  <circle cx="60" cy="80"
          r="25"
          fill="#dcebd2"
          opacity="0.9"
          stroke="#6b9962"
          stroke-width="2"/>

  <path d="
      M45 80
      Q60 65 75 80
      Q60 95 45 80"
      fill="none"
      stroke="#5c8c59"
      stroke-width="3"/>

</svg>
